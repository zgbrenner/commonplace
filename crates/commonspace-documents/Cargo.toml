[package]
name = "commonspace-documents"
description = "Deterministic document tooling and safe file operations for Commonspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
commonspace-core.workspace = true
commonspace-permissions.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
blake3 = "1"
infer = "0.22"
mime_guess = "2"
trash = "5"
encoding_rs = "0.8"
chardetng = "1"
walkdir = "2"
docx-rs = "0.4.22"
pdf-extract = "0.12.0"
lopdf = "0.44.0"
# Spreadsheets are read and written by two independent libraries on purpose:
# whatever `rust_xlsxwriter` produces is validated by re-parsing it with
# `calamine`, so a malformed workbook is caught before success is reported.
calamine = "0.36.1"
rust_xlsxwriter = "0.97.1"
# `inline` gives word-level highlighting inside a changed line, which is the
# difference between a readable and an unreadable diff of reflowed prose;
# `unicode` makes that tokenization word-aware for scripts that are not
# space-separated. Apache-2.0, on deny.toml's allow-list.
similar = { version = "3.1.2", features = ["inline", "unicode"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
