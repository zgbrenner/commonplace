[package]
name = "commonspace-agents"
description = "Commonspace agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
commonspace-core.workspace = true
commonspace-permissions.workspace = true
process-wrap = { version = "9.1.0", features = ["tokio1"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true
which = "8.0.5"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

# Landlock is a Linux kernel feature, so its bindings are a Linux-only
# dependency: macOS and Windows builds never see it in their graph. Maintained
# by landlock-lsm, the same people as the kernel LSM, under MIT OR Apache-2.0.
[target."cfg(target_os = \"linux\")".dependencies]
landlock = "0.4.7"
