name: Release

# Builds installers for every supported operating system and attaches them to
# a draft GitHub Release.
#
# Each installer must be built on the operating system it targets — macOS in
# particular cannot be cross-compiled — which is the one job a local-only
# workflow genuinely cannot do from a single machine.
#
# The release is created as a *draft*: nothing is published until a human
# opens it, checks the artifacts, and presses publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to build a release that would not pass the normal gates.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        shell: bash
        run: scripts/lint

      - name: Test
        shell: bash
        run: scripts/test

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    # `contents: write` is for the draft release tauri-action creates. The
    # other two belong to the provenance step below: `id-token` lets it mint
    # the short-lived Sigstore signing certificate, `attestations` lets it
    # store the signed statement against this repository. A job-level block
    # replaces the workflow-level one outright rather than adding to it, so
    # `contents: write` has to be repeated here.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (universal)
            args: "--target universal-apple-darwin"
            # Space-separated: `rustup target add` takes each target as its
            # own argument, and a comma-separated string is read as one
            # (nonexistent) target name.
            rust-targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: Linux
            args: ""
            rust-targets: ""
          - os: windows-latest
            name: Windows
            args: ""
            rust-targets: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Add Rust targets
        if: matrix.rust-targets != ''
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set these repository secrets to have the updater's `.sig`
          # files generated; without them the installers still build fine, the
          # release simply carries no update signatures.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Commonspace ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Installers are attached below.

            Commonspace is pre-release software. Read `docs/status.md` in this
            tag for exactly what is verified working and what is not.

            These builds are **not code-signed**. Windows SmartScreen will warn
            on first run, and macOS Gatekeeper will require opening the app
            through System Settings → Privacy & Security.
          releaseDraft: true
          prerelease: true
          # Attach `latest.json` so the in-app "Check for updates" button can
          # install releases in place. Meaningful only when the signing
          # secrets above are set; without them there are no updater
          # artifacts to describe and the app falls back to a GitHub API
          # version check plus a download-page link.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # `subject-path` wants one path per line; tauri-action reports what it
      # built as a JSON array. Convert it rather than globbing at bundle
      # directories by hand — those differ per OS, and the macOS universal
      # build lands under a target-triple directory the others do not have.
      #
      # An empty list means the bundler produced nothing this job can attest,
      # which is a broken release build, not a step to skip quietly.
      - name: Collect built installer paths
        id: artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          paths="$(printf '%s' "${ARTIFACT_PATHS:-[]}" | jq -r '.[]')"
          if [ -z "${paths}" ]; then
            echo "::error::tauri-action reported no artifact paths; nothing to attest."
            exit 1
          fi
          echo "${paths}"
          {
            echo 'paths<<ARTIFACT_PATHS_EOF'
            echo "${paths}"
            echo 'ARTIFACT_PATHS_EOF'
          } >> "${GITHUB_OUTPUT}"

      # Record where each installer came from. The action mints a short-lived
      # keyless Sigstore certificate and signs a SLSA provenance statement
      # binding the artifact's digest to this workflow, this commit and this
      # runner. Anyone can check one afterwards:
      #
      #   gh attestation verify <file> --repo zgbrenner/commonplace
      #
      # Be clear about what this is not. An attestation is not code signing.
      # It does nothing for macOS Gatekeeper or Windows SmartScreen, it is
      # not an OS trust anchor, and it does not make installing any smoother
      # — the unsigned-build warnings in the release body above stay exactly
      # as they are. Its whole value is that a security-minded reader can
      # verify a download's provenance themselves instead of trusting the
      # release page. Code signing and notarization are separate work
      # (docs/releasing.md, "Code signing").
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.artifacts.outputs.paths }}

  # Automates the "download at least one installer and install it" half of the
  # release checklist for Windows: fetch the freshly drafted release's NSIS
  # installer, install it silently, and fail the run if the packaged binary
  # does not land on disk. Launching the GUI — and the macOS and Linux
  # installs — remain manual for now, and the release stays a draft either
  # way: a human still opens it, launches one build, and presses publish.
  verify-windows-install:
    name: Verify Windows install
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    # Draft releases are only visible to authenticated callers with write
    # access, so the read-only default token would not see the draft at all.
    permissions:
      contents: write
    steps:
      # `gh release download <tag>` resolves via the releases/tags API, which
      # never returns drafts. Listing all releases and matching tag_name does,
      # so find the asset id that way and download it by id with the
      # octet-stream Accept header. bash (Git Bash) keeps the byte stream
      # intact when redirecting to a file.
      - name: Download the drafted Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Locating the release drafted for tag ${RELEASE_TAG}..."
          asset="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"${RELEASE_TAG}\") | .assets[] | select(.name | endswith(\"-setup.exe\"))][0] // empty | \"\(.id) \(.name)\"")"
          if [ -z "${asset}" ]; then
            echo "::error::No *-setup.exe asset found on the release for tag ${RELEASE_TAG}."
            exit 1
          fi
          asset_id="${asset%% *}"
          asset_name="${asset#* }"
          echo "Downloading ${asset_name} (asset id ${asset_id})..."
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > commonspace-setup.exe
          ls -l commonspace-setup.exe

      - name: Silent-install and verify the packaged binary
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'commonspace-setup.exe'
          Write-Host "Silently installing $setup"
          $proc = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($proc.ExitCode)."
            exit 1
          }
          # Same tolerant lookup as pr-builds.yml: the binary may keep the
          # crate name (commonspace-desktop.exe), the root depends on the
          # NSIS install mode, and NSIS can return a beat before files
          # settle — match by prefix, search every realistic root, poll.
          function Find-InstalledExe {
            foreach ($root in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $root) { continue }
              $hit = Get-ChildItem -Path $root -Filter 'commonspace*.exe' -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notmatch 'setup|uninstall' } |
                Select-Object -First 1
              if ($hit) { return $hit }
            }
            return $null
          }
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $exe = Find-InstalledExe
            if ($exe) { break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          if (-not $exe) {
            Write-Host 'Registry uninstall entries mentioning Commonspace (for diagnosis):'
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                             'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*Commonspace*' } |
              Select-Object DisplayName, InstallLocation, DisplayVersion | Format-List | Out-String | Write-Host
            Write-Error 'Silent install finished but no Commonspace binary was found under LOCALAPPDATA or Program Files.'
            exit 1
          }
          Write-Host "Packaged binary installed at: $($exe.FullName)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
            '### Windows install verification',
            '',
            '- Drafted NSIS installer ran silently and exited 0.',
            "- ``Commonspace.exe`` found at ``$($exe.FullName)``.",
            '- Not verified here: launching the GUI, and the macOS/Linux installers. The release is still a draft; a human presses publish.'
          )
