[package]
name = "commonspace-desktop"
description = "Commonspace desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Tauri requires a cdylib for mobile targets and a lib for the desktop binary.
name = "commonspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
commonspace-core.workspace = true
commonspace-permissions.workspace = true
commonspace-documents.workspace = true
commonspace-storage.workspace = true
commonspace-agents.workspace = true
commonspace-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
chrono.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[lints]
workspace = true
