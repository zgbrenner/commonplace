[package]
name = "commonspace-desktop"
description = "Commonspace desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# Tauri requires a cdylib for mobile targets and a lib for the desktop binary.
name = "commonspace_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
commonspace-core.workspace = true
commonspace-permissions.workspace = true
commonspace-documents.workspace = true
commonspace-storage.workspace = true
commonspace-agents.workspace = true
commonspace-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# A packaged Windows GUI build has no console, so stdout logging reaches
# nobody; this writes the same lines to a bounded set of daily files. MIT,
# and part of the `tracing` project itself rather than a third-party bridge.
tracing-appender = "0.2"
# The redaction rules for the diagnostics file. Already in the dependency
# graph, so this makes a direct use of it rather than adding a new crate.
regex = "1"
# The OS name and version in the diagnostics file: the difference between
# Windows 10 and 11, or between two distributions, is often the whole bug.
os_info = { version = "3", default-features = false }
tokio.workspace = true
chrono.workspace = true
# Content hashes for attachment metadata (sha256 of small attached files).
sha2.workspace = true
# `protocol-asset` backs the artifact previews; its scope stays empty in
# tauri.conf.json and is widened at runtime only for folders the user has
# authorized.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A task can run for minutes, so the desktop notification is how a finished
# task reaches someone who has switched to another window.
tauri-plugin-notification = "2"
# The update check compares release versions properly (so "0.1.10" is newer
# than "0.1.9") and the fallback path asks the GitHub API which release is
# current. `reqwest` matches the TLS stack the updater plugin already uses.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[lints]
workspace = true
